<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World Without Borders · Esfera Inmersiva</title>
  <style>
    :root { --bg: #050507; --text: #e5e5e5; --accent: #6aff9a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; overflow: hidden;
      cursor: url('cursor.png') 25 25, auto;
    }
    
    .btn, .item, .menu-toggle, #lang-select {
      cursor: url('cursor.png') 25 25, pointer !important;
    }
    
    /* SIDEBAR */
    aside {
      width: 280px; background: #08080a; z-index: 10;
      display: flex; flex-direction: column;
      box-shadow: 4px 0 15px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
    }
    .aside-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .aside-header h2 { font-size: 13px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; font-weight: 600; }
    .aside-header p { font-size: 11px; opacity: 0.4; }
    
    .project-credits {
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.03);
      font-size: 10px;
      opacity: 0.5;
      line-height: 1.5;
    }
    .project-credits a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .project-credits a:hover { opacity: 1; }
    
    .list-container { flex: 1; overflow-y: auto; padding: 12px; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
    
    .item {
      padding: 14px 12px; border-radius: 8px; margin-bottom: 6px;
      transition: background 0.2s, transform 0.1s; font-size: 14px;
      display: flex; align-items: center; gap: 12px; color: #aaa;
    }
    .item:hover { background: rgba(255,255,255,0.05); color: #fff; transform: translateX(3px); }
    .item.active { 
      background: rgba(106,255,154,0.1); color: var(--accent); 
      border-left: 3px solid var(--accent); font-weight: 500;
    }
    .item span.pais { font-size: 11px; opacity: 0.5; margin-left: auto; text-transform: uppercase; letter-spacing: 0.5px; }
    .item .color-dot { width: 9px; height: 9px; border-radius: 50%; background: #333; flex-shrink: 0; }

    /* MAIN STAGE */
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; perspective: 1200px; background: radial-gradient(circle at center, #0d0d10 0%, #050507 70%);
    }

    .sphere-stage {
      display: flex; gap: 3vmin; align-items: center; justify-content: center;
      transform-style: preserve-3d; flex-wrap: wrap; padding: 20px;
    }

    /* EFECTO 3D */
    .sphere {
      width: 55vmin; height: 55vmin; max-width: 580px; max-height: 580px;
      border-radius: 50%; position: relative; overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #333, #0a0a0a 60%, #000);
      box-shadow: 
        0 25px 60px rgba(0,0,0,0.9),
        inset 0 -20px 40px rgba(0,0,0,0.8),
        inset 0 15px 30px rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s;
      animation: float 6s ease-in-out infinite;
    }
    .sphere:hover { transform: scale(1.03) rotateY(5deg); box-shadow: 0 0 40px rgba(106,255,154,0.15); }
    
    .sphere::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.6) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.5) 100%);
      pointer-events: none; z-index: 2;
    }

    .sphere img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
      opacity: 0.9; mix-blend-mode: luminosity;
    }
    
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    /* UI */
    .meta-panel {
      position: absolute; bottom: 25px; text-align: center; z-index: 5;
      background: rgba(0,0,0,0.5); padding: 12px 24px; border-radius: 20px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.05);
      max-width: 90%;
    }
    .meta-panel h3 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .meta-panel p { font-size: 13px; opacity: 0.6; letter-spacing: 1px; }
    
    .main-credits {
      position: absolute; top: 20px; left: 25px; z-index: 5;
      font-size: 10px; opacity: 0.4; letter-spacing: 0.5px; line-height: 1.4;
      text-align: left; max-width: 200px;
    }
    .main-credits a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .main-credits a:hover { opacity: 1; }
    
    .controls { position: absolute; top: 20px; right: 25px; display: flex; gap: 12px; z-index: 20; align-items: center; }
    .btn {
      background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1); 
      padding: 9px 14px; border-radius: 8px; font-size: 12px; transition: 0.2s;
      backdrop-filter: blur(4px);
    }
    .btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    
    #lang-select {
      background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 10px; border-radius: 6px; font-size: 12px; outline: none;
    }
    #lang-select option { background: #08080a; color: #ccc; }

    /* MOBILE */
    @media (max-width: 768px) {
      aside { position: fixed; height: 100%; transform: translateX(-100%); width: 80%; }
      aside.open { transform: translateX(0); }
      .sphere { width: 42vw; height: 42vw; max-width: 320px; max-height: 320px; }
      .menu-toggle { display: flex; position: fixed; top: 15px; left: 15px; z-index: 30; width: 40px; height: 40px; align-items: center; justify-content: center; }
      .main-credits { display: none; }
    }
    @media (min-width: 769px) { .menu-toggle { display: none; } }
  </style>
</head>
<body>

  <button class="btn menu-toggle" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>

  <aside id="sidebar">
    <div class="aside-header">
      <h2 id="lbl-participants">PARTICIPANTES</h2>
      <p id="lbl-select">Selecciona para visualizar</p>
    </div>
    
    <div class="project-credits">
      <strong>The World Without Borders</strong><br>
      a cura di Attilio Fortini<br>
      <a href="https://venusianpeople.com" target="_blank" rel="noopener">venusianpeople.com</a>
    </div>
    
    <div class="list-container" id="list"></div>
  </aside>

  <main>
    <div class="main-credits">
      <strong>The World Without Borders</strong><br>
      a cura di Attilio Fortini<br>
      <a href="https://venusianpeople.com" target="_blank" rel="noopener">venusianpeople.com</a>
    </div>

    <div class="controls">
      <select id="lang-select" onchange="setLanguage(this.value)">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="it">IT</option>
      </select>
      <button class="btn" id="btn-audio" onclick="toggleAudio()">🔇 Audio</button>
      <button class="btn active" id="btn-auto" onclick="toggleAuto()">⏸ Auto</button>
    </div>

    <div class="sphere-stage" id="stage"></div>

    <div class="meta-panel">
      <h3 id="artist-name">---</h3>
      <p id="artist-country">---</p>
    </div>
  </main>

  <script>
    // 📦 LISTA COMPLETA DE 106 PARTICIPANTES
    const nombres = [
      "Alessandra Tonizzo","Alfonso Caccavale","Ana Pobo Castaner","Angela Caporaso","Anna Boschi","Anna Maria Matone",
      "Antonio Amato","Antonio Sassu","Antonio Tonizzo","Attilio Fortini","Beate Senf-Hentsch","Birgitta Volz",
      "Bruno Capatti","Bruno Chiarlone","Carmela Sarcina","Ceren Baykan","Christiane Carré","Circulaire 132",
      "Claudio Gavina","Dame Mailarta","Dania Genitli","Daniel Daligand","Diana Magalon","Eva Grabenhofer",
      "Fabrizio Bandini","Fabrizio Pavolucci","Felipe Lamadrid","Flavia Ciappa","Floki Gauvry","Giacomo Acquaroli",
      "Gianfranco Brambati","Giovanni Strada","Gloria Ken","Guroga","Hans Jurgen Kuster","Hugo Pontes",
      "Ignazio Lago","Imerio Rovelli","Isabella Branella","Jacek Czapczynski","Jeff Bagato","Joey Patrickt",
      "Jon Foster","Jon Howe","Julian Foster","Katerina Mandari","Keiichi Nakamura","Lara Favaro",
      "Lars Schumacher","Leona K","Linda Pelati","Marco Pasian","Mari Giupponi & Giuli","Maria do Carmo Both",
      "Maria Grazia Piazza","Maria Teresa Cazzaro","Marilena Marson","Mauro Andreani","Max Ghj","Maya Lopez Muro",
      "Melanie Bareis","Michel Della Vedova","Michelangelo Mayo","Miguel Jimenez","Miroslav Blagojevic",
      "Mirta Caccaro","Ovidio Petca","Paola Galbiati","Patrizia Dellavalle","Paulo Teles","Pedro Baricat",
      "Peter Abajkovics","Petra Lorenz","Poul Poclage","Raquel Gociol","Renata Strada","Renato Tonizzo",
      "Rittiner & Gomez","Roberto Formigoni","Roberto Scala","Ryosuke Cohen","Sabela Bana","Sabina Romanin",
      "Sandro Di Cesare","Serse Luigetti","Snappy","Sofia Sirbu","Stephen Tomasko","Susan Gold",
      "Susanne Schumacher","The Wasted Angel","Tiziana Pretto","Tofu","Valentina Stefanescu","Valerie Ceravolo",
      "Varju Krisztián","Veronique Pozzi Painé","Virginie Loreau","Vittore Baroni","Walter Lobsiger","William Lee",
      "Zdenek Sima","Zlatko Krstevsk","Zorica Obradovic"
    ];

    const obras = nombres.map((n, i) => ({
      nombre: n,
      pais: "Global",
      color: `hsl(${(i * 137) % 360}, 60%, 35%)`,
      img: `https://picsum.photos/seed/${encodeURIComponent(n)}/600/600`
    }));

    let idx = 0, autoPlay = true, audioCtx = null, isPlaying = false, osc = null, gain = null;
    const stage = document.getElementById('stage');
    const listEl = document.getElementById('list');
    const nameEl = document.getElementById('artist-name');
    const countryEl = document.getElementById('artist-country');
    const btnAuto = document.getElementById('btn-auto');
    const btnAudio = document.getElementById('btn-audio');

    // 1. Renderizar lista
    obras.forEach((o, i) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="color-dot" style="background:${o.color}"></div><span>${o.nombre}</span>`;
      div.onclick = () => { idx = i; updateView(); if(autoPlay) toggleAuto(); };
      listEl.appendChild(div);
    });

    // 2. Crear esferas
    for(let i=0; i<2; i++) {
      const s = document.createElement('div');
      s.className = 'sphere';
      s.innerHTML = `<img src="" alt="">`;
      stage.appendChild(s);
    }

    // 3. Actualizar vista
    function updateView() {
      const spheres = document.querySelectorAll('.sphere');
      nameEl.textContent = obras[idx].nombre;
      countryEl.textContent = obras[idx].pais;
      
      spheres.forEach((s, i) => {
        const oIdx = (idx + i) % obras.length;
        const o = obras[oIdx];
        s.style.background = `radial-gradient(circle at 30% 30%, ${o.color}, #0a0a0a 65%, #000)`;
        s.querySelector('img').src = o.img;
      });

      document.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
        if(i === idx) el.scrollIntoView({behavior:'smooth', block:'center'});
      });
      history.replaceState(null, '', `?obra=${idx+1}`);
    }

    // 4. Auto-play
    setInterval(() => {
      if(autoPlay) { idx = (idx+1)%obras.length; updateView(); }
    }, 6000);

    // 5. Traducciones
    const translations = {
      es: { title: "The World Without Borders · Esfera Inmersiva", participants: "PARTICIPANTES", select: "Selecciona para visualizar", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manual" },
      en: { title: "The World Without Borders · Immersive Sphere", participants: "PARTICIPANTS", select: "Select to view", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manual" },
      it: { title: "The World Without Borders · Sfera Immersiva", participants: "PARTECIPANTI", select: "Seleziona per visualizzare", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manuale" }
    };
    let currentLang = 'es';

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.title = t.title;
      document.getElementById('lbl-participants').textContent = t.participants;
      document.getElementById('lbl-select').textContent = t.select;
      btnAudio.textContent = isPlaying ? t.audioOn : t.audioOff;
      btnAuto.textContent = autoPlay ? t.autoPause : t.autoPlay;
    }

    // 6. 🔊 AUDIO CON VOLUMEN AUMENTADO (0.18 en lugar de 0.08)
    async function toggleAudio() {
      const t = translations[currentLang];
      
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          
          osc = audioCtx.createOscillator();
          gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();
          
          osc.type = 'sine';
          osc.frequency.value = 110;
          
          filter.type = 'lowpass';
          filter.frequency.value = 300;
          filter.Q.value = 1;
          
          gain.gain.value = 0;
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          
          // 🔊 VOLUMEN AUMENTADO: 0.18 (antes 0.08)
          gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.5);
          
          isPlaying = true;
        } else {
          if (audioCtx.state === 'running') {
            await audioCtx.suspend();
            isPlaying = false;
          } else {
            await audioCtx.resume();
            isPlaying = true;
          }
        }
        
        btnAudio.textContent = isPlaying ? t.audioOn : t.audioOff;
        btnAudio.classList.toggle('active', isPlaying);
        
      } catch(e) {
        console.error("Audio error:", e);
        btnAudio.textContent = "❌ Audio";
      }
    }

    // 7. Toggle Auto
    function toggleAuto() {
      autoPlay = !autoPlay;
      setLanguage(currentLang);
      btnAuto.classList.toggle('active', autoPlay);
    }

    // Inicializar
    updateView();
    setLanguage('es');
    console.log("✅ Audio aumentado a 0.18. Listo para GitHub.");
  </script>
</body>
</html>
