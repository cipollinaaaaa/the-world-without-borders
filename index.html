<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World Without Borders</title>
  <style>
    :root { --bg: #050507; --text: #e5e5e5; --accent: #6aff9a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; overflow: hidden;
      cursor: url('cursor.png') 25 25, auto;
    }
    
    .btn, .item, .menu-toggle, #lang-select {
      cursor: url('cursor.png') 25 25, pointer !important;
    }
    
    aside {
      width: 280px; background: #08080a; z-index: 10;
      display: flex; flex-direction: column;
      box-shadow: 4px 0 15px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    .aside-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .aside-header h2 { font-size: 13px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; font-weight: 600; }
    .aside-header p { font-size: 11px; opacity: 0.4; }
    
    .project-credits {
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.03);
      font-size: 10px;
      opacity: 0.5;
      line-height: 1.5;
      margin-top: auto;
    }
    .project-credits a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .project-credits a:hover { opacity: 1; }
    
    .list-container { flex: 1; overflow-y: auto; padding: 12px; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
    
    .item {
      padding: 14px 12px; border-radius: 8px; margin-bottom: 6px;
      transition: background 0.2s, transform 0.1s; font-size: 14px;
      display: flex; align-items: center; gap: 12px; color: #aaa;
    }
    .item:hover { background: rgba(255,255,255,0.05); color: #fff; transform: translateX(3px); }
    .item.active { 
      background: rgba(106,255,154,0.1); color: var(--accent); 
      border-left: 3px solid var(--accent); font-weight: 500;
    }
    .item .color-dot { width: 9px; height: 9px; border-radius: 50%; background: #333; flex-shrink: 0; }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; 
      background: radial-gradient(circle at center, #111 0%, #050507 70%);
      padding: 20px;
    }

    .artwork-wrapper {
      position: relative;
      max-width: 90%;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    
    .artwork-wrapper img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 4px;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
    }

    .meta-panel {
      margin-top: 20px;
      text-align: center; z-index: 5;
      background: rgba(0,0,0,0.5); padding: 12px 24px; border-radius: 20px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.05);
    }
    .meta-panel h3 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .meta-panel p { font-size: 13px; opacity: 0.6; letter-spacing: 1px; }
    
    .main-credits {
      position: absolute; top: 20px; left: 25px; z-index: 5;
      font-size: 10px; opacity: 0.4; letter-spacing: 0.5px; line-height: 1.4;
      text-align: left; max-width: 200px;
    }
    .main-credits a { color: var(--accent); text-decoration: none; }
    
    .controls { position: absolute; top: 20px; right: 25px; display: flex; gap: 12px; z-index: 20; align-items: center; }
    .btn {
      background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1); 
      padding: 9px 14px; border-radius: 8px; font-size: 12px; transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    
    #lang-select {
      background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 10px; border-radius: 6px; font-size: 12px; outline: none;
    }
    #lang-select option { background: #08080a; color: #ccc; }

    @media (max-width: 768px) {
      aside { position: fixed; height: 100%; transform: translateX(-100%); width: 80%; }
      aside.open { transform: translateX(0); }
      .menu-toggle { display: flex; position: fixed; top: 15px; left: 15px; z-index: 30; width: 40px; height: 40px; align-items: center; justify-content: center; background: #222; border: 1px solid #444; }
      .main-credits { display: none; }
      .artwork-wrapper img { max-height: 55vh; }
    }
    @media (min-width: 769px) { .menu-toggle { display: none; } }
  </style>
</head>

      { nombre: "Walter Lobsiger", img: "walter-lobsiger.png" },
      { nombre: "William Lee", img: "william-lee.png" },
      { nombre: "Zdenek Sima", img: "zdenek-sima.png" },
      { nombre: "Zlatko Krstevsk", img: "zlatko-krstevsk.png" },
      { nombre: "Zorica Obradovic", img: "zorica-obradovic.png" }
    ];

    let idx = 0, autoPlay = true, audioCtx = null, isPlaying = false, osc = null, gain = null, lfo = null, lfoGain = null;
    const mainImg = document.getElementById('main-img');
    const listEl = document.getElementById('list');
    const nameEl = document.getElementById('artist-name');
    const countryEl = document.getElementById('artist-country');
    const btnAuto = document.getElementById('btn-auto');
    const btnAudio = document.getElementById('btn-audio');

    // 1. Renderizar lista
    artistas.forEach((artista, i) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="color-dot" style="background:hsl(${(i * 137) % 360}, 60%, 35%)"></div><span>${artista.nombre}</span>`;
      div.onclick = () => { idx = i; updateView(); if(autoPlay) toggleAuto(); };
      listEl.appendChild(div);
    });

    // 2. Actualizar vista con fallback a placeholder
    function updateView() {
      const artista = artistas[idx];
      
      nameEl.textContent = artista.nombre;
      countryEl.textContent = "";
      
      const img = new Image();
      img.onload = () => {
        mainImg.src = artista.img;
      };
      img.onerror = () => {
        const seed = encodeURIComponent(artista.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""));
        mainImg.src = `https://picsum.photos/seed/${seed}/800/600`;
      };
      img.src = artista.img;

      document.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
        if(i === idx) el.scrollIntoView({behavior:'smooth', block:'center'});
      });
      history.replaceState(null, '', `?obra=${idx+1}`);
    }

    // 3. Auto-play
    setInterval(() => {
      if(autoPlay) { idx = (idx+1)%artistas.length; updateView(); }
    }, 6000);

    // 4. Traducciones
    const translations = {
      es: { title: "The World Without Borders", participants: "PARTICIPANTES", select: "Selecciona para visualizar", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manual" },
      en: { title: "The World Without Borders", participants: "PARTICIPANTS", select: "Select to view", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manual" },
      it: { title: "The World Without Borders", participants: "PARTECIPANTI", select: "Seleziona per visualizzare", audioOn: "🔊 Audio", audioOff: "🔇 Audio", autoPause: "⏸ Auto", autoPlay: "▶ Manuale" }
    };
    let currentLang = 'es';

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.title = t.title;
      document.getElementById('lbl-participants').textContent = t.participants;
      document.getElementById('lbl-select').textContent = t.select;
      btnAudio.textContent = isPlaying ? t.audioOn : t.audioOff;
      btnAuto.textContent = autoPlay ? t.autoPause : t.autoPlay;
    }

    // 5. 🔊 AUDIO ESPACIAL MEJORADO (más fuerte + atmósfera cósmica)
    async function toggleAudio() {
      const t = translations[currentLang];
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          
          // Oscilador principal: tono grave espacial
          osc = audioCtx.createOscillator();
          gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();
          
          // 🔊 Configuración "sonido del espacio"
          osc.type = 'sine';
          osc.frequency.value = 85; // Más grave para sensación cósmica
          
          // Filtro más abierto para textura rica
          filter.type = 'lowpass';
          filter.frequency.value = 600; // Deja pasar más frecuencias
          filter.Q.value = 0.7;
          
          // 🔊 Volumen aumentado: 0.30 (casi el doble que antes)
          gain.gain.value = 0;
          
          // 🌌 LFO para efecto "respiración espacial" (modulación suave del volumen)
          lfo = audioCtx.createOscillator();
          lfoGain = audioCtx.createGain();
          lfo.type = 'sine';
          lfo.frequency.value = 0.08; // Muy lento: una "ola" cada ~12 segundos
          lfoGain.gain.value = 0.08; // Variación sutil del volumen
          
          lfo.connect(lfoGain);
          lfoGain.connect(gain.gain);
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          lfo.start();
          
          // Fade-in suave
          gain.gain.linearRampToValueAtTime(0.30, audioCtx.currentTime + 0.8);
          
          isPlaying = true;
        } else {
          if (audioCtx.state === 'running') { 
            await audioCtx.suspend(); 
            isPlaying = false; 
          } else { 
            await audioCtx.resume(); 
            isPlaying = true; 
          }
        }
        btnAudio.textContent = isPlaying ? t.audioOn : t.audioOff;
        btnAudio.classList.toggle('active', isPlaying);
      } catch(e) { 
        console.error("Audio error:", e); 
        btnAudio.textContent = "❌ Audio"; 
      }
    }

    // 6. Toggle Auto
    function toggleAuto() {
      autoPlay = !autoPlay;
      setLanguage(currentLang);
      btnAuto.classList.toggle('active', autoPlay);
    }

    // Inicializar
    updateView();
    setLanguage('es');
    console.log(`✅ ${artistas.length} participantes. Audio espacial activado.`);
